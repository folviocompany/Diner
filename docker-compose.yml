services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: diner
      MYSQL_USER: diner
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-diner_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - diner_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  diner_mysql:
