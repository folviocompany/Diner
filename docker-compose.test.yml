services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: diner_test
      MYSQL_USER: diner_test
      MYSQL_PASSWORD: diner_test
      MYSQL_ROOT_PASSWORD: root_test
    ports:
      - '127.0.0.1:3307:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -proot_test --silent']
      interval: 3s
      timeout: 5s
      retries: 40
